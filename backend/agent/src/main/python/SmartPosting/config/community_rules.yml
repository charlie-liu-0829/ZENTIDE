global_rules:
  - 不得发布手机号、密码、访问令牌、私钥等敏感信息
  - 标题应准确描述正文，不使用与内容无关的夸张表述
  - 引用他人内容时应说明来源
  - 发布问题前应说明已尝试的方法以及仍未解决之处

# 可按现场覆盖或追加规则，键为 scene_id。修改后无需重启服务。
scene_rules: {}

type_requirements:
  QUESTION:
    - 问题描述
    - 运行环境
    - 复现步骤
    - 预期结果
    - 实际结果
    - 已尝试方案
  EXPERIENCE:
    - 适用场景
    - 具体方案
    - 优缺点
    - 使用限制
    - 参考内容
  EVENT:
    - 时间
    - 地点
    - 参与方式
    - 人数限制
    - 报名截止时间
  REVIEW:
    - 评测对象
    - 使用场景
    - 评价维度
    - 优点
    - 缺点
    - 结论
  POLL:
    - 调查问题
    - 选项说明
    - 截止时间
  DISCUSSION:
    - 讨论背景
    - 核心观点或问题
